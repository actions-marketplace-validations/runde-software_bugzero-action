name: "bugzero auto-fix"
description: "Run the bugzero agent in your own runner to open a PR fixing a reported error. Your code never leaves your infrastructure."
author: "bugzero"
branding:
  icon: "git-pull-request"
  color: "red"
inputs:
  run-id:
    description: "The bugzero run id (passed in by the bugzero workflow's inputs)."
    required: true
  callback-token:
    description: "Per-run token used to fetch context and post the result."
    required: true
  control-plane:
    description: "bugzero control-plane base URL, passed in by the bugzero workflow. Defaults to https://bugzero.dev."
    required: false
  github-token:
    description: "Token used to push the fix branch and open the PR."
    required: false
    default: ${{ github.token }}
runs:
  using: "node24"
  main: "dist/index.js"
